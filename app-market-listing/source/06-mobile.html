<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  .phone { position: absolute; top: 130px; width: 344px; height: 716px; border-radius: 48px; background: #0b1220; padding: 12px; box-shadow: 0 30px 70px rgba(0,0,0,.4); }
  .phone .scr { width: 320px; height: 692px; border-radius: 38px; overflow: hidden; background: #fff; position: relative; }
  .phone .scr img { display: block; width: 320px; }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 14px; background: #0b1220; z-index: 1; }
  .status-bar { height: 40px; background: #fff; }
</style>
</head>
<body>
  <div class="caption">Mobile-friendly, so customers can trade in and track from anywhere</div>
  <!-- Real widgets at 390px: status page with revised offer, and the form -->
  <div class="phone" style="left: 210px"><div class="scr"><div class="notch"></div><div class="status-bar"></div><img src="../harness/raw/status-mobile.png" alt=""></div></div>
  <div class="phone" style="left: 646px"><div class="scr"><div class="notch"></div><div class="status-bar"></div><img src="../harness/raw/form-mobile.png" alt=""></div></div>
</body>
</html>
