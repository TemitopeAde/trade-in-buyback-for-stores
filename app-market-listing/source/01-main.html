<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; color: #fff; }
  .logo { width: 96px; height: 96px; border-radius: 24px; overflow: hidden; margin-bottom: 34px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .logo img { width: 100%; height: 100%; display: block; }
  h1 { font-size: 58px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  .tagline { margin-top: 22px; font-size: 26px; line-height: 1.4; font-weight: 400; color: #d1fae5; }

  /* Real UI crops: the product page button and the form's live estimate */
  .card { position: absolute; background: #fff; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.35); overflow: hidden; border: 0; }
  .cta { left: 600px; top: 110px; width: 520px; height: 460px; }
  .cta img { width: 1020px; left: -500px; top: -75px; }
  .est { left: 540px; top: 600px; width: 560px; height: 136px; }
  .est img { width: 1020px; left: -229px; top: -775px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="logo"><img src="../images/app-icon.png" alt=""></div>
    <h1>Trade In Credit</h1>
    <p class="tagline">Turn your customers’ used items into store credit and repeat sales.</p>
  </div>
  <div class="card crop cta"><img src="../harness/raw/cta.png" alt=""></div>
  <div class="card crop est"><img src="../harness/raw/form.png" alt=""></div>
</body>
</html>
