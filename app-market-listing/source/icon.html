<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1000px; height: 1000px; overflow: hidden; background: #0f5f4f; }
  svg { display: block; }
</style>
</head>
<body>
<!-- App icon: solid brand background, swap arrows around a price tag. No text, no frame. -->
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="1000" fill="#0f5f4f"/>

  <!-- Swap arrows -->
  <g fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="butt">
    <path d="M 227.5 400.8 A 290 290 0 0 1 772.5 400.8"/>
    <path d="M 772.5 599.2 A 290 290 0 0 1 227.5 599.2"/>
  </g>
  <g fill="#ffffff">
    <polygon points="838,376 707,424 801,486"/>
    <polygon points="162,624 293,576 199,514"/>
  </g>

  <!-- Price tag -->
  <g transform="translate(-25 27) rotate(-45 500 500)">
    <path d="M 372 500 L 440 418 L 628 418 Q 640 418 640 430 L 640 570 Q 640 582 628 582 L 440 582 Z"
          fill="#34d399" stroke="#34d399" stroke-width="22" stroke-linejoin="round"/>
    <circle cx="456" cy="500" r="22" fill="#0f5f4f"/>
  </g>
</svg>
</body>
</html>
