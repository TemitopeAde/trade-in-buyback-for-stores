<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="thumbnail.css">
<style>
  .head { display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f1f3; }
  .row .prod { width: 26px; height: 26px; flex: 0 0 auto; }
  .row .txt { flex: 1; }
  .row .amt { width: 30px; height: 7px; border-radius: 3px; background: #0f5f4f; opacity: .8; }
  .list { margin-top: 8px; }
</style>
</head>
<body>
  <div class="glow a"></div><div class="glow b"></div>
  <div class="card">
    <div class="head"><h1>My trade-ins</h1><div class="btn brand" style="width:58px;height:18px"></div></div>
    <div class="list">
      <div class="row"><div class="prod"></div><div class="txt"><div class="line" style="width:70%"></div><div class="line" style="width:40%;margin-top:5px;height:5px"></div></div><span class="pill green" style="width:42px"></span><span class="amt"></span></div>
      <div class="row"><div class="prod"></div><div class="txt"><div class="line" style="width:58%"></div><div class="line" style="width:34%;margin-top:5px;height:5px"></div></div><span class="pill amber" style="width:42px"></span><span class="amt"></span></div>
      <div class="row"><div class="prod"></div><div class="txt"><div class="line" style="width:64%"></div><div class="line" style="width:44%;margin-top:5px;height:5px"></div></div><span class="pill blue" style="width:42px"></span><span class="amt"></span></div>
    </div>
  </div>
</body>
</html>
